---
layout: default
---

<div class="post">
  <h1>{{ page.title }}</h1>
  <h2>{{page.author}}</h2>
  <span class="fs-4 text-muted">{{ page.date | date: "%b %d, %y" }}</span>
  <div class="mt-4">{{ content }}</div>
</div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4/dist/mermaid.esm.min.mjs';
  import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.1.5/dist/mermaid-layout-elk.esm.min.mjs';
  mermaid.initialize({             htmlLabels:true, startOnLoad: true, theme: "dark" });

  mermaid.registerLayoutLoaders(elkLayouts);
</script>

<style>
.hidden{
display: none
}
</style>
